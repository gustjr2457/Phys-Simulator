<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhysLab 점검</title>
<style>
  body{margin:0;padding:24px;background:#0e0f11;color:#e6e7ea;font:13px/1.6 "Malgun Gothic",sans-serif}
  h1{font-size:17px;margin:0 0 4px}
  p{color:#9a9da6;margin:0 0 16px}
  code,pre{font-family:Consolas,monospace;font-size:12px}
  pre{background:#0a0b0c;border:1px solid #2a2c31;padding:12px;white-space:pre-wrap;max-height:70vh;overflow:auto}
  .ok{color:#7fb894}.bad{color:#c4705f}
  button{font:inherit;padding:6px 12px;background:#26282e;color:#e6e7ea;border:1px solid #42454d;cursor:pointer}
</style>
</head>
<body>
<h1>PhysLab 점검</h1>
<p>74종 전부를 실제 화면에서 나오는 9가지 캔버스 크기로 그려 보고 <b>예외 · 글자 겹침 · 캔버스 밖 잘림</b>을 셉니다.
   잘림은 화면 밖으로 나간 물체(빠른 음원, 시야 밖 선박 등)에 붙은 라벨이면 정상입니다.
   dev 서버에서 열어야 합니다 (<code>node tools/dev-server.js</code> → <code>/tools/check.html</code>).
   크기를 바꾸려면 <code>?sizes=1542x850,760x420</code>. 결과는 <code>window.RESULT</code>에도 남습니다.</p>
<button id="run">다시 실행</button>
<pre id="out">준비 중…</pre>
<script>
/* 기본 검사 크기 = 실제 화면에서 나오는 무대 캔버스의 "논리" 크기 (app.js 의 uiScale 반영 후,
   그래프·문제방이 있는 시뮬 기준 — 가장 빡빡한 경우).
   27" QHD · FHD · 1440×900 · 1366×768 · 태블릿 가로 · 태블릿 세로 · 폰(430 · 390 · 360 폭) */
const DEFAULT_SIZES = '1407x704,1132x566,799x416,725x363,705x353,733x419,507x549,436x471,417x436';
const qs = new URLSearchParams(location.search);
const SIZES = (qs.get('sizes') || DEFAULT_SIZES).split(',').map(s => s.split('x').map(Number));
const ONLY = qs.get('only');   // 특정 시뮬레이션만 (쉼표로 여러 개)
const DT = 1 / 480, STEPS = 1800, SNAP_EVERY = 600;
const STAGE = [10, 11, 12];          // 무대 바탕색 — 투명 픽셀은 이 색 위에 합성해 본다
const out = document.getElementById('out');

function loadApp() {
  return new Promise(res => {
    const f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;left:-9999px;top:0;width:1400px;height:820px';
    f.src = '../index.html?motion=off';
    f.onload = () => {
      // 앱 안의 콘솔 에러·처리 안 된 예외를 모은다 (그리기 예외는 app.js 가 잡아 console.error 로 남긴다)
      const W = f.contentWindow; W.__errs = [];
      const ce = W.console.error.bind(W.console);
      W.console.error = (...a) => { W.__errs.push(a.map(x => x && x.stack ? x.stack.split('\n')[0] : String(x)).join(' ')); ce(...a); };
      W.addEventListener('error', e => W.__errs.push('error: ' + e.message));
      W.addEventListener('unhandledrejection', e => W.__errs.push('rejection: ' + e.reason));
      // 앱은 시뮬레이션 본체를 열 때만 불러온다 — 점검은 78종 전부가 필요하다
      setTimeout(() => W.eval('PS.loadAll()').then(() => res(W)), 300);
    };
    document.body.appendChild(f);
  });
}

/* fillText 를 가로채 글자 상자를 모은다. D.tag 글자는 늘 헤일로를 두르므로 가독성(대비) 검사에서는 빼고, 겹침은 센다. */
function instrument(PS, ctx) {
  const rec = [];
  let inTag = 0;
  const D = PS.D, tag0 = D.tag;
  D.tag = function () { inTag++; try { return tag0.apply(this, arguments); } finally { inTag--; } };
  const ft = ctx.fillText;
  ctx.fillText = function (t, x, y) {
    t = String(t);
    if (t.trim()) {
      const m = ctx.measureText(t), tr = ctx.getTransform();
      if (Math.abs(tr.b) < 1e-6 && Math.abs(tr.c) < 1e-6) {          // 회전된 글자는 건너뛴다
        const w = m.width;
        let lx = x;
        if (ctx.textAlign === 'center') lx = x - w / 2;
        else if (ctx.textAlign === 'right' || ctx.textAlign === 'end') lx = x - w;
        const x0 = tr.a * lx + tr.e, x1 = tr.a * (lx + w) + tr.e;
        const y0 = tr.d * (y - m.actualBoundingBoxAscent) + tr.f, y1 = tr.d * (y + m.actualBoundingBoxDescent) + tr.f;
        rec.push({ t, x0: Math.min(x0, x1), x1: Math.max(x0, x1), y0: Math.min(y0, y1), y1: Math.max(y0, y1),
                   tag: inTag > 0, a: ctx.globalAlpha, col: String(ctx.fillStyle) });
      }
    }
    return ft.apply(this, arguments);
  };
  return { rec, restore() { D.tag = tag0; delete ctx.fillText; } };
}

/* 가독성 — 어두운 글자(밝은 바탕용)가 실제로 밝은 바탕 위에 있는가.
   밝은 글자는 앱에서 무대 배경색 헤일로를 두르므로(core.js) 어떤 바탕에서도 읽힌다 — 대상이 아니다.
   글자를 빼고 한 번 더 그려 얻은 배경 픽셀과 글자 색의 명암 대비가 3 미만이면 잡는다. */
const hex2 = c => { const m = c.match(/^#([0-9a-f]{6})$/i); if (m) return [0, 2, 4].map(i => parseInt(m[1].substr(i, 2), 16));
  const n = c.match(/[\d.]+/g); return n ? n.slice(0, 3).map(Number) : [0, 0, 0]; };
const isLight = c => { const v = hex2(c); return .299 * v[0] + .587 * v[1] + .114 * v[2] > 70; };
const relLum = ([r, g, b]) => { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(r) + .7152 * f(g) + .0722 * f(b); };
const contrast = (a, b) => { const x = relLum(a), y = relLum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
function legibility(rec, bgCtx, w, h) {
  const bad = [];
  for (const r of rec) {
    if (r.tag || r.a < .5 || isLight(r.col)) continue;
    const y = Math.round((r.y0 + r.y1) / 2); if (y < 0 || y >= h) continue;
    const xs = [.2, .4, .6, .8].map(f => Math.round(r.x0 + (r.x1 - r.x0) * f)).filter(x => x >= 0 && x < w);
    if (!xs.length) continue;
    const bg = [0, 0, 0];
    xs.forEach(x => { const d = bgCtx.getImageData(x, y, 1, 1).data, al = d[3] / 255; for (let k = 0; k < 3; k++) bg[k] += (d[k] * al + STAGE[k] * (1 - al)) / xs.length; });
    const c = contrast(hex2(r.col), bg);
    if (c < 3) bad.push(r.t.slice(0, 24) + ' (대비 ' + c.toFixed(2) + ')');
  }
  return bad;
}

function overlaps(rec) {
  const hits = [];
  for (let j = 1; j < rec.length; j++) {
    const B = rec[j];
    if (B.a < .35) continue;                                // 아주 흐린 글자는 장식 (태그도 이제 상자가 없어 겹치면 안 읽힌다)
    for (let i = 0; i < j; i++) {
      const A = rec[i];
      if (A.a < .35) continue;
      if (A.t === B.t && Math.abs(A.x0 - B.x0) < 2 && Math.abs(A.y0 - B.y0) < 2) continue;   // 글로우용 겹쳐 그리기
      const ix = Math.min(A.x1, B.x1) - Math.max(A.x0, B.x0), iy = Math.min(A.y1, B.y1) - Math.max(A.y0, B.y0);
      if (ix <= 1 || iy <= 1) continue;
      const small = Math.min((A.x1 - A.x0) * (A.y1 - A.y0), (B.x1 - B.x0) * (B.y1 - B.y0));
      if (ix * iy > small * .2) hits.push(A.t + '  ×  ' + B.t);
    }
  }
  return hits;
}

/* ?stress — 극한 실행. 78종 × (기본 · 전부 최소 · 전부 최대 · 각 프리셋) 을 init → 6초 step 하며 1초마다
   readouts · sample · draw 하고, 이어서 실제 앱에서 시뮬레이션마다 열고 프리셋을 눌러 콘솔 에러를 모은다.
   예외만 본다 — 극한값에서의 글자 겹침은 가독성 관문(기본 모드)의 대상이 아니다. */
async function stress(W, PS) {
  const result = { mode: 'stress', errors: [], console: [], total: { draws: 0, runs: 0, appViews: 0 } };
  const sizes = qs.get('sizes') ? SIZES : [[1407, 704], [417, 436]];
  const SIMS = ONLY ? PS.sims.filter(s => ONLY.split(',').includes(s.id)) : PS.sims;
  const cv = W.document.createElement('canvas'), ctx = cv.getContext('2d');
  for (const sim of SIMS) {
    const lo = {}, hi = {};
    sim.params.forEach(p => { lo[p.key] = p.min; hi[p.key] = p.max; });
    const sets = [['기본', {}]].concat((sim.presets || []).map(pr => ['프리셋 ' + pr.name, pr.set]), [['전부 최소', lo], ['전부 최대', hi]]);
    for (const [tag, set] of sets) for (const [w, h] of sizes) {
      cv.width = w; cv.height = h;
      try {
        const P = {}; sim.params.forEach(p => P[p.key] = p.value); Object.assign(P, set);
        const st = sim.init(P); st.t = 0; result.total.runs++;
        const hl = Object.keys(sim.vars || {})[0] || null;
        for (let i = 1; i <= 6 * 480; i++) {
          if (!st.done) { sim.step(st, P, DT); st.t += DT; }
          if (i % 480) continue;
          sim.readouts(st, P); sim.sample && sim.sample(st, P);
          for (const h0 of [null, hl]) {
            ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, w, h);
            ctx.__labels = [];
            sim.draw(ctx, st, P, { w, h, hl: h0, playing: true }); result.total.draws++;
          }
        }
      } catch (e) { result.errors.push(sim.id + ' ' + tag + ' ' + w + 'x' + h + ' → ' + e.message); }
    }
    out.textContent = '극한 실행 중… ' + sim.id;
    await new Promise(r => setTimeout(r));
  }
  // 실제 앱: 시뮬레이션마다 열고, 프리셋을 하나씩 누르며 몇 프레임씩 돌린다 (app.js 의 측정값·과제·그래프·빛 층 경로까지)
  // headless 는 화면 밖 iframe 의 애니메이션 프레임을 거의 돌리지 않는다 — 프레임을 기다리되 시간 제한을 둔다
  const frames = n => Promise.race([
    new Promise(r => { let k = 0; const f = () => (++k >= n ? r() : W.requestAnimationFrame(f)); W.requestAnimationFrame(f); }),
    new Promise(r => setTimeout(r, 40 * n))]);
  W.__errs.forEach(m => result.console.push('(처음 불러올 때) ' + m));
  for (const sim of SIMS) {
    const before = W.__errs.length;
    W.location.hash = '#/' + sim.id; await frames(4);
    for (const b of W.document.querySelectorAll('#presets .preset')) { b.click(); await frames(3); }
    result.total.appViews++;
    W.__errs.slice(before).forEach(m => result.console.push(sim.id + ': ' + m));
  }
  const bad = result.errors.length + result.console.length;
  out.innerHTML = '<span class="' + (bad ? 'bad' : 'ok') + '">극한 실행 ' + result.total.runs + '회 · 그리기 ' + result.total.draws + '회 · 앱에서 연 시뮬레이션 ' +
    result.total.appViews + '종\n예외 ' + result.errors.length + ' · 콘솔 에러 ' + result.console.length + '</span>\n' +
    result.errors.concat(result.console).slice(0, 40).join('\n').replace(/</g, '&lt;');
  window.RESULT = result;
  const j = document.createElement('script'); j.type = 'application/json'; j.id = 'result';
  j.textContent = JSON.stringify(result); document.body.appendChild(j);
  document.querySelector('iframe').remove();
  return result;
}

async function run() {
  out.textContent = '앱 불러오는 중…';
  const W = await loadApp();
  const PS = W.eval('PS');   // core.js 의 const PS 는 window 속성이 아니다
  if (qs.has('stress')) return stress(W, PS);
  const cv = W.document.createElement('canvas'), ctx = cv.getContext('2d');
  const result = { sizes: {}, errors: [], illegible: {}, total: { draws: 0, overlaps: 0, clipped: 0, illegible: 0 } };
  const bgCv = W.document.createElement('canvas'), bgCtx = bgCv.getContext('2d', { willReadFrequently: true });
  const SIMS = ONLY ? PS.sims.filter(s => ONLY.split(',').includes(s.id)) : PS.sims;
  if (ONLY && !SIMS.length) throw new Error('only=' + ONLY + ' — 등록된 시뮬레이션이 없다');
  result.only = ONLY || null; result.simCount = SIMS.length;

  for (const [w, h] of SIZES) {
    const key = w + 'x' + h, S = result.sizes[key] = { overlaps: {}, clipped: {}, draws: 0 };
    cv.width = w; cv.height = h; bgCv.width = w; bgCv.height = h;
    for (const sim of SIMS) {
      for (const pre of [null].concat(sim.presets || [])) {
        const tag = sim.id + (pre ? ' / ' + pre.name : '');
        try {
          const P = {}; sim.params.forEach(p => P[p.key] = p.value);
          if (pre) Object.assign(P, pre.set);
          const st = sim.init(P); st.t = 0;
          const hls = [null].concat(Object.keys(sim.vars || {}).slice(0, 3));
          for (let i = 1; i <= STEPS; i++) {
            sim.step(st, P, DT); st.t += DT;
            if (i % SNAP_EVERY) continue;
            for (const hl of hls) {
              ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, w, h);
              const I = instrument(PS, ctx);
              ctx.__labels = [];   // 앱과 같은 조건
              try { sim.draw(ctx, st, P, { w, h, hl, playing: true }); } finally { I.restore(); }
              S.draws++;
              for (const o of overlaps(I.rec)) (S.overlaps[sim.id] = S.overlaps[sim.id] || new Set()).add(o);
              for (const r of I.rec)
                if (r.x0 < -2 || r.x1 > w + 2 || r.y0 < -2 || r.y1 > h + 2)
                  (S.clipped[sim.id] = S.clipped[sim.id] || new Set()).add(r.t);
              if (hl === null) {   // 같은 장면을 글자 없이 다시 그려 배경을 얻는다
                bgCtx.setTransform(1, 0, 0, 1, 0, 0); bgCtx.clearRect(0, 0, w, h);
                bgCtx.fillText = () => {};
                const tag0 = PS.D.tag; PS.D.tag = () => {};
                bgCtx.__labels = null;
                try { sim.draw(bgCtx, st, P, { w, h, hl: null, playing: true }); } finally { delete bgCtx.fillText; PS.D.tag = tag0; }
                for (const b of legibility(I.rec, bgCtx, w, h)) (result.illegible[sim.id] = result.illegible[sim.id] || new Set()).add(key + ': ' + b);
              }
            }
            sim.readouts && sim.readouts(st, P);
            sim.sample && sim.sample(st, P);
          }
        } catch (e) { result.errors.push(key + ' ' + tag + ' → ' + e.message); }
      }
    }
    const n = o => Object.values(o).reduce((a, s) => a + s.size, 0);
    S.overlapCount = n(S.overlaps); S.clippedCount = n(S.clipped);
    result.total.draws += S.draws; result.total.overlaps += S.overlapCount; result.total.clipped += S.clippedCount;
    out.textContent = '검사 중… ' + key;
    await new Promise(r => setTimeout(r));
  }

  // 보고
  const L = [];
  L.push('시뮬레이션 ' + PS.sims.length + '종 · 그리기 ' + result.total.draws + '회');
  for (const id in result.illegible) result.illegible[id] = [...result.illegible[id]];
  result.total.illegible = Object.values(result.illegible).reduce((a, v) => a + v.length, 0);
  L.push('예외 ' + result.errors.length + ' · 겹침 ' + result.total.overlaps + ' · 잘림 ' + result.total.clipped + ' · 안 읽히는 글자 ' + result.total.illegible);
  L.push('');
  for (const [k, S] of Object.entries(result.sizes)) {
    L.push('■ ' + k + '   겹침 ' + S.overlapCount + '   잘림 ' + S.clippedCount);
    for (const [id, set] of Object.entries(S.overlaps)) L.push('   겹침 ' + id + ': ' + [...set].slice(0, 4).join(' | '));
    for (const [id, set] of Object.entries(S.clipped)) L.push('   잘림 ' + id + ': ' + [...set].slice(0, 4).join(' | '));
  }
  for (const [id, arr] of Object.entries(result.illegible)) L.push('   안 읽힘 ' + id + ': ' + arr.slice(0, 4).join(' | '));
  if (result.errors.length) { L.push(''); L.push('예외:'); result.errors.slice(0, 30).forEach(e => L.push('   ' + e)); }
  out.innerHTML = '<span class="' + (result.errors.length + result.total.overlaps + result.total.clipped + result.total.illegible ? 'bad' : 'ok') + '">' +
    L.shift() + '\n' + L.shift() + '</span>\n' + L.join('\n').replace(/</g, '&lt;');
  // 집합은 JSON 으로 못 넘기므로 배열로
  for (const S of Object.values(result.sizes)) for (const f of ['overlaps', 'clipped'])
    for (const id in S[f]) S[f][id] = [...S[f][id]];
  window.RESULT = result;
  // 자동 실행(tools/daily-check.js)이 headless 브라우저의 DOM 에서 읽는다
  const j = document.createElement('script'); j.type = 'application/json'; j.id = 'result';
  j.textContent = JSON.stringify(result); document.body.appendChild(j);
  document.querySelector('iframe').remove();
  return result;
}
document.getElementById('run').onclick = () => run().catch(fail);
function fail(e) {
  out.innerHTML = '<span class="bad">점검 자체가 실패했습니다: ' + e.message + '</span>'; window.RESULT = { failed: e.message };
  const j = document.createElement('script'); j.type = 'application/json'; j.id = 'result';
  j.textContent = JSON.stringify(window.RESULT); document.body.appendChild(j);
}
run().catch(fail);
</script>
</body>
</html>
