<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhysLab · 물리 이론의 시각화</title>
<meta name="description" content="힘과 운동부터 양자역학, 궤도역학, 선박·기계 공학까지 물리 이론 81가지를 슬라이더로 직접 움직여 보는 시뮬레이터. 공식의 기호를 누르면 화면에서 그 값이 어디에 작용하는지 보여 줍니다.">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<!-- 공유 미리보기 — og:image 는 절대 주소여야 메신저·SNS 가 읽는다 (원본: tools/og-image.html) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="PhysLab">
<meta property="og:url" content="https://phys-simulator-shs.vercel.app/">
<meta property="og:title" content="PhysLab · 물리 이론의 시각화">
<meta property="og:description" content="물리 이론 81가지를 슬라이더로 직접 움직여 보는 시뮬레이터. 기초 물리부터 고등 물리, 항공우주·선박·기계 공학까지.">
<meta property="og:image" content="https://phys-simulator-shs.vercel.app/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="PhysLab 로고와, 포물선을 그리며 날아가는 공과 속도 성분 화살표">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 한글 UI: IBM Plex Sans KR · 숫자: IBM Plex Mono · 수식: STIX Two Text -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=eeceb830">
<link rel="stylesheet" href="css/motion.css?v=567593f3">
<script>
/* 모션 단계 — 기본은 c(여운). 비교용으로 ?motion=off|a|b 를 붙이면 그 단계로 본다 (css/motion.css 참고) */
(function () {
  var m = (new URLSearchParams(location.search).get('motion') || 'c').toLowerCase();
  var on = { a: ['m-a'], b: ['m-a', 'm-b'], c: ['m-a', 'm-b', 'm-c'] }[m];
  if (!on) return;
  var d = document.documentElement;
  on.concat('first-load').forEach(function (c) { d.classList.add(c); });
  addEventListener('load', function () { setTimeout(function () { d.classList.remove('first-load'); }, 900); });
})();
</script>
</head>
<body>

<aside id="nav" aria-label="시뮬레이션 목록">
  <div class="brand">
    <h1>PhysLab</h1>
    <p>물리 이론의 시각화</p>
  </div>
  <button id="btnGroupMenu" class="group-menu-btn" title="분야 선택">
    <span class="gm-ico"><svg class="i" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></span><span id="groupLabel">기초 과정</span><span class="gm-caret"><svg class="i" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg></span>
  </button>
  <div class="modes" role="group" aria-label="과정">
    <button class="mode on" data-mode="concept" data-group="core" title="초급 과정 (공식 없이 감 잡기)">초급</button>
    <button class="mode" data-mode="basic" data-group="core" title="고등물리 (물리학Ⅰ)">고등물리</button>
    <button class="mode" data-mode="general" data-group="core" title="일반물리 (역학 · 유체 · 열 · 전자기 · 파동 · 상대성)">일반물리</button>
    <button class="mode" data-mode="exp" data-group="modern" title="유명한 실험 (이론이 실제로 어떻게 증명됐는지)">실험실</button>
    <button class="mode" data-mode="quantum" data-group="modern" title="양자역학 (미시세계)">양자역학</button>
    <button class="mode" data-mode="astro" data-group="modern" title="천문학 (별빛 읽기 · 별의 일생 · 우주의 크기 · 외계행성)">천문학</button>
    <button class="mode" data-mode="aero" data-group="applied" title="항공우주공학 (비행역학 · 궤도역학 · 로켓 추진 · 재진입)">항공우주</button>
    <button class="mode" data-mode="marine" data-group="applied" title="선박공학, 자율운항시스템공학 (저항·추진 · 복원성 · 내항성 · 운항 제어)">선박</button>
    <button class="mode" data-mode="mech" data-group="applied" title="기계공학 (고체역학 · 파괴역학 · 열공학 · 진동공학)">기계</button>
    <button class="mode" data-mode="adv" data-group="applied" title="공학응용 (분야 공통 계측·신호)">공학응용</button>
  </div>
  <button id="btnFormulaIndex" class="formula-index-btn" title="등록된 모든 시뮬레이션의 공식을 트랙별로 모아봅니다"><svg class="i" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M12 3H4l4.5 5L4 13h8"/></svg><span class="fi-text">전체 공식 모음</span></button>
  <nav id="simlist" aria-label="이 과정의 시뮬레이션"></nav>
  <footer class="nav-foot">
    <p><b>Space</b> 재생/정지 · <b>R</b> 처음으로</p>
    <p>공식의 <span class="mini-term">기호</span>를 누르면 화면 어디에서 작용하는지 알려줍니다.</p>
  </footer>
</aside>

<main id="main">
  <header id="head">
    <div>
      <span id="simCat"></span>
      <h2 id="simTitle"></h2>
      <p id="simTag"></p>
    </div>
  </header>

  <section class="stage">
    <div class="cv-wrap">
      <canvas id="cv" role="img" aria-label="시뮬레이션 화면"></canvas>
      <!-- 형광 잔광 층: 화면의 빛 번짐. 원본(#cv)은 선명하게 두고 이 층만 시간에 따라 서서히 사라진다 -->
      <canvas id="cvHalo" aria-hidden="true"></canvas>
      <canvas id="cvGlow" aria-hidden="true"></canvas>
      <!-- 글자 층: D.text · D.tag 는 빛 번짐 위에 따로 그려 늘 선명하다 -->
      <canvas id="cvText" aria-hidden="true"></canvas>
    </div>
    <div class="stage-bar">
      <button id="btnPlay" class="btn primary" aria-keyshortcuts="Space"><span class="ico"><svg class="i" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path class="f" d="M5 3.2v9.6L12.6 8z"/></svg></span><span id="playLabel" class="btn-text">재생</span></button>
      <button id="btnReset" class="btn" aria-keyshortcuts="R"><span class="ico"><svg class="i" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 8a5 5 0 1 0 1.5-3.6"/><path d="M3 2.5v2.5h2.5"/></svg></span><span class="btn-text">처음으로</span></button>
      <label class="speed">
        <span class="speed-word">속도</span> <input type="range" id="speed" min="0.1" max="2" step="0.1" value="1">
        <b id="speedVal">1.0×</b>
      </label>
      <div class="clock"><span class="run-led" aria-hidden="true"></span>t = <b id="clock">0.00</b> s</div>
    </div>
  </section>

  <!-- 공식 — 무대 바로 아래에 가로로. 기호를 가리키거나 누르면 아래 줄에 그 기호가 화면 어디에서 작용하는지 -->
  <section id="cardFormula" class="formula-bar" aria-label="공식">
    <div id="formulas"></div>
    <div id="termInfo" class="term-info" aria-live="polite"></div>
  </section>

  <section id="graphs"></section>

  <section id="questRoom" class="quest-room hidden" aria-labelledby="questTitle">
    <div class="quest-head"><span class="quest-icon"><svg class="i" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="2"/></svg></span><h3 id="questTitle">문제방</h3><span class="quest-sub">이 시뮬레이션의 도전 과제</span></div>
    <div id="challenges" class="quest-list"></div>
  </section>
</main>

<aside id="panel">
  <section class="card" id="cardControls">
    <h3>값 바꿔보기</h3>
    <div id="controls"></div>
    <div id="presets" class="presets"></div>
  </section>

  <section class="card" id="cardReadouts">
    <h3>측정값</h3>
    <table id="readouts" class="readouts" aria-live="off"><tbody></tbody></table>
  </section>

  <section class="card" id="cardNotes">
    <h3>이것만은 알아두기</h3>
    <ul id="notes"></ul>
  </section>
</aside>

<div id="groupModal" class="modal-overlay hidden">
  <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="groupModalTitle">
    <div class="modal-head">
      <h2 id="groupModalTitle">분야 선택</h2>
      <button id="btnCloseGroups" class="modal-close" title="닫기 (Esc)" aria-label="닫기"><svg class="i" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="modal-body" id="groupList"></div>
  </div>
</div>

<div id="formulaModal" class="modal-overlay hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="formulaModalTitle">
    <div class="modal-head">
      <h2 id="formulaModalTitle"><svg class="i" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M12 3H4l4.5 5L4 13h8"/></svg>전체 공식 모음</h2>
      <input type="search" id="formulaSearch" placeholder="공식 이름, 시뮬레이션 이름으로 검색…" autocomplete="off" aria-label="공식 검색">
      <button id="btnCloseFormulas" class="modal-close" title="닫기 (Esc)" aria-label="닫기"><svg class="i" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div id="formulaListWrap" class="modal-body"></div>
  </div>
</div>

<!-- 화면 읽기 프로그램용 알림 (과제 달성 등) -->
<div id="announcer" class="sr-only" aria-live="polite"></div>

<script src="js/core.js?v=49b247cd"></script>
<!-- 시뮬레이션 색인 — 목록·공식 모음용. 본체(js/sims/**)는 열 때 불러온다 (core.js PS.load, tools/build.js) -->
<script src="js/catalog.js?v=9c6ccaee"></script>
<script src="js/typeset.js?v=7cf413bf"></script>
<script src="js/app.js?v=fa3fa6d0"></script>
</body>
</html>
