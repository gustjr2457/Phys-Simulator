<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhysLab — 물리 이론의 시각화</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside id="nav">
  <div class="brand">
    <div class="logo">Φ</div>
    <div>
      <h1>PhysLab</h1>
      <p>물리 이론의 시각화</p>
    </div>
  </div>
  <button id="btnGroupMenu" class="group-menu-btn" title="분야 선택">
    <span class="gm-ico">☰</span><span id="groupLabel">기초 과정</span><span class="gm-caret">▾</span>
  </button>
  <div class="modes">
    <button class="mode on" data-mode="concept" data-group="core" title="초급 과정 — 공식 없이 감 잡기">초급</button>
    <button class="mode" data-mode="basic" data-group="core" title="고등물리 — 물리학Ⅰ">고등물리</button>
    <button class="mode" data-mode="general" data-group="core" title="일반물리 — 역학 · 유체 · 열 · 전자기 · 파동 · 상대성">일반물리</button>
    <button class="mode" data-mode="exp" data-group="modern" title="유명한 실험 — 이론이 실제로 어떻게 증명됐는지">실험실</button>
    <button class="mode" data-mode="quantum" data-group="modern" title="양자역학 — 미시세계">양자역학</button>
    <button class="mode" data-mode="astro" data-group="modern" title="천문학 — 별빛 읽기 · 별의 일생 · 우주의 크기 · 외계행성">천문학</button>
    <button class="mode" data-mode="aero" data-group="applied" title="항공우주공학 — 비행역학 · 궤도역학 · 로켓 추진 · 재진입">항공우주</button>
    <button class="mode" data-mode="marine" data-group="applied" title="선박공학(자율운항시스템공학) — 저항·추진 · 복원성 · 내항성 · 운항 제어">선박</button>
    <button class="mode" data-mode="mech" data-group="applied" title="기계공학 — 고체역학 · 파괴역학 · 열공학 · 진동공학">기계</button>
    <button class="mode" data-mode="adv" data-group="applied" title="공학응용 — 분야 공통 계측·신호">공학응용</button>
  </div>
  <button id="btnFormulaIndex" class="formula-index-btn" title="등록된 모든 시뮬레이션의 공식을 트랙별로 모아봅니다">Σ 전체 공식 모음</button>
  <div id="simlist"></div>
  <footer class="nav-foot">
    <p><b>Space</b> 재생/정지 · <b>R</b> 처음으로</p>
    <p>공식의 <span class="mini-term">기호</span>에 마우스를 올려보세요.</p>
  </footer>
</aside>

<main id="main">
  <header id="head">
    <div>
      <span class="chip" id="simCat"></span>
      <h2 id="simTitle"></h2>
      <p id="simTag"></p>
    </div>
  </header>

  <section class="stage">
    <canvas id="cv"></canvas>
    <div class="stage-bar">
      <button id="btnPlay" class="btn primary"><span class="ico">▶</span><span id="playLabel">재생</span></button>
      <button id="btnReset" class="btn"><span class="ico">↺</span>처음으로</button>
      <label class="speed">
        속도 <input type="range" id="speed" min="0.1" max="2" step="0.1" value="1">
        <b id="speedVal">1.0×</b>
      </label>
      <div class="clock">t = <b id="clock">0.00</b> s</div>
    </div>
  </section>

  <section id="graphs"></section>

  <section id="questRoom" class="quest-room hidden">
    <div class="quest-head"><span class="quest-icon">🎯</span><h3>문제방</h3><span class="quest-sub">이 시뮬레이션의 도전 과제</span></div>
    <div id="challenges" class="quest-list"></div>
  </section>
</main>

<aside id="panel">
  <section class="card" id="cardFormula">
    <h3>공식</h3>
    <div id="formulas"></div>
  </section>

  <section class="card">
    <h3>값 바꿔보기</h3>
    <div id="controls"></div>
    <div id="presets" class="presets"></div>
    <div id="termInfo" class="term-info">
      <span class="ti-hint">공식의 기호나 위 슬라이더에 마우스를 올리면, 그 값이 화면 어디에서 작용하는지 여기에 알려줍니다.</span>
    </div>
  </section>

  <section class="card">
    <h3>측정값</h3>
    <div id="readouts" class="readouts"></div>
  </section>

  <section class="card" id="cardNotes">
    <h3>이것만은 알아두기</h3>
    <ul id="notes"></ul>
  </section>
</aside>

<div id="groupModal" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <div class="modal-head">
      <h2>분야 선택</h2>
      <button id="btnCloseGroups" class="modal-close" title="닫기(Esc)">✕</button>
    </div>
    <div class="modal-body" id="groupList"></div>
  </div>
</div>

<div id="formulaModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-head">
      <h2>Σ 전체 공식 모음</h2>
      <input type="text" id="formulaSearch" placeholder="공식 이름, 시뮬레이션 이름으로 검색…" autocomplete="off">
      <button id="btnCloseFormulas" class="modal-close" title="닫기(Esc)">✕</button>
    </div>
    <div id="formulaListWrap" class="modal-body"></div>
  </div>
</div>

<script src="js/core.js"></script>

<!-- ═══ 기초 과정 ═══ -->
<!-- 초급 · 개념 -->
<script src="js/sims/concept/force_intro.js"></script>
<script src="js/sims/concept/energy_intro.js"></script>
<script src="js/sims/concept/heat_intro.js"></script>
<script src="js/sims/concept/entropy_intro.js"></script>

<script src="js/sims/general/g_bernoulli.js"></script>

<script src="js/app.js"></script>
</body>
</html>
